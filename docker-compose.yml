services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: complylet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/01-roles.sql:/docker-entrypoint-initdb.d/01-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d complylet"]
      interval: 2s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: local-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-admin
      KC_HOSTNAME: http://localhost:8080
      # CVE-2026-114938 mitigation until the container JVM baseline is verified.
      JAVA_OPTS_APPEND: "-XX:-UseBASE64Intrinsics"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infrastructure/keycloak/realm.json:/opt/keycloak/data/import/complylet-realm.json:ro
  mailpit:
    image: axllent/mailpit:v1.28.0
    ports:
      - "127.0.0.1:8025:8025"
volumes:
  postgres-data:
